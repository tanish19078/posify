name: backend
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run contracts:check
      - run: npm test
      - run: npm run build
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: posify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d posify_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSIFY_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/posify_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-inference.lock
      - run: pip install --no-deps -e .
      - run: python -c "import onnxruntime; assert onnxruntime.__version__ == '1.31.1'"
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: pytest -q
      - run: python scripts/export_contracts.py --check
