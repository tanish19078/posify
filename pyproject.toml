[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posify-backend"
version = "0.1.0"
description = "Offline equipment identification and inspection backend"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "Pillow>=11,<13", "numpy>=2,<3", "SQLAlchemy>=2.0,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4", "pypdf>=6.10,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ocr = ["paddleocr>=3.2,<4", "paddlepaddle>=3.2,<4"]
retrieval = ["sentence-transformers>=5,<6"]
detector = ["onnxruntime>=1.31.1,<2"]
vision = ["opencv-python-headless>=5,<6"]
reader = ["rapidocr==3.10.0", "onnxruntime>=1.31.1,<2"]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]
