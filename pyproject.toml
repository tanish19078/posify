[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posify-backend"
version = "0.1.0"
description = "Offline equipment identification and inspection backend"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ocr = ["paddleocr>=3.2,<4", "paddlepaddle>=3.2,<4"]
retrieval = ["sentence-transformers>=5,<6"]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]
