services:
  web:
    build: ./apps/web
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      api:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: posify
      POSTGRES_USER: posify
      POSTGRES_PASSWORD: ${POSIFY_DB_PASSWORD:?Set a URL-safe POSIFY_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U posify -d posify"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build: &backend_build
      context: .
      args:
        POSIFY_WITH_DETECTOR: ${POSIFY_WITH_DETECTOR:-false}
    command: [python, scripts/migrate.py]
    environment:
      POSIFY_DATABASE_URL: postgresql+psycopg://posify:${POSIFY_DB_PASSWORD}@db:5432/posify
    depends_on:
      db:
        condition: service_healthy
  api:
    build: *backend_build
    environment: &runtime
      POSIFY_API_TOKEN: ${POSIFY_API_TOKEN:-}
      POSIFY_AUTH_MODE: ${POSIFY_AUTH_MODE:-development}
      POSIFY_QUEUE_LIMIT: ${POSIFY_QUEUE_LIMIT:-100}
      POSIFY_JOB_DEADLINE_SECONDS: ${POSIFY_JOB_DEADLINE_SECONDS:-1800}
      POSIFY_DATABASE_URL: postgresql+psycopg://posify:${POSIFY_DB_PASSWORD}@db:5432/posify
      POSIFY_AUTO_MIGRATE: 'false'
      POSIFY_CAPTURE_DIR: /data/captures
      POSIFY_DOCUMENT_DIR: /data/documents
      POSIFY_OCR_ENGINE: ${POSIFY_OCR_ENGINE:-disabled}
      POSIFY_DETECTOR_MANIFEST: ${POSIFY_DETECTOR_MANIFEST:-}
      POSIFY_DETECTOR_THREADS: ${POSIFY_DETECTOR_THREADS:-1}
      POSIFY_PADDLE_DET_DIR: ${POSIFY_PADDLE_DET_DIR:-}
      POSIFY_PADDLE_REC_DIR: ${POSIFY_PADDLE_REC_DIR:-}
      POSIFY_EMBEDDING_DIR: ${POSIFY_EMBEDDING_DIR:-}
      POSIFY_OLLAMA_MODEL: ${POSIFY_OLLAMA_MODEL:-}
      POSIFY_OLLAMA_URL: ${POSIFY_OLLAMA_URL:-http://127.0.0.1:11434}
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - captures:/data/captures
      - documents:/data/documents
      - ./models:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: *backend_build
    command: [python, -m, posify.worker]
    environment: *runtime
    volumes:
      - captures:/data/captures:ro
      - ./models:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  database:
  captures:
  documents:
